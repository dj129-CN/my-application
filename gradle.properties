# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX / Kotlin conventions.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# A single build JVM is enough for this small module and avoids an extra
# long-lived Kotlin daemon in restricted CI/sandbox environments.
kotlin.compiler.execution.strategy=in-process

# SDK 34/build-tools 34.0.0 must be installed. Builds never silently mutate the
# local Android SDK, which keeps CI and local results deterministic.
android.builder.sdkDownload=false
